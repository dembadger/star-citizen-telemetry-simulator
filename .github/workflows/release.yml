name: Release simulator
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v0.1.0)
        required: true
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/TelemetrySimulator -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - run: ./scripts/Test-Stream.ps1 ./publish/StarCitizenTelemetrySimulator.exe
      - name: Package and release the tested executable
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected vMAJOR.MINOR.PATCH' }
          $zip = "StarCitizenTelemetrySimulator-$env:VERSION-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  $zip" | Set-Content SHA256SUMS.txt -Encoding ascii
          gh release create $env:VERSION $zip SHA256SUMS.txt --target $env:GITHUB_SHA --title "Telemetry Simulator $env:VERSION" --generate-notes
