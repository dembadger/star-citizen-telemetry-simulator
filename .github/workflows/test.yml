name: PR checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Simulator stream test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/TelemetrySimulator -c Release
      - run: ./scripts/Test-Stream.ps1 ./src/TelemetrySimulator/bin/Release/net10.0-windows/StarCitizenTelemetrySimulator.exe
